<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GCal Sync{% endblock %}</title>
<style>
  body { max-width: 32rem; margin: 3rem auto; padding: 0 1rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; color: #1a1a1a; }
  h1 { margin-bottom: 0.25rem; }
  .btn { display: inline-block; padding: 0.6em 1.2em; border-radius: 6px; text-decoration: none; font-weight: 600; }
  .btn-primary { background: #0b5fff; color: #fff; }
  .btn-secondary { background: #eee; color: #1a1a1a; border: none; cursor: pointer; font-size: 1em; }
  .account { display: flex; justify-content: space-between; align-items: center; padding: 0.75em 0; border-bottom: 1px solid #eee; }
  .muted { color: #777; font-size: 0.9em; }
  .error { background: #fee; border: 1px solid #f99; padding: 0.75em; border-radius: 6px; margin-bottom: 1em; }
  .success { background: #efe; border: 1px solid #9c9; padding: 0.75em; border-radius: 6px; margin-bottom: 1em; }
  form.inline { display: inline; }
  footer { margin-top: 3rem; font-size: 0.85em; color: #777; }
  footer a { color: inherit; }
</style>
</head>
<body>
  {% block body %}{% endblock %}
  <footer><a href="{{ url_for('privacy') }}">Privacy Policy</a></footer>
</body>
</html>
