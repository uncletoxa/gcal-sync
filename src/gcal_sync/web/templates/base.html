<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GCal Sync{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background-color: #f8f9fa; }
  .page { max-width: 40rem; }
</style>
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar bg-white border-bottom">
    <div class="container page">
      <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">GCal Sync</a>
    </div>
  </nav>

  <main class="container page flex-grow-1 py-5">
    {% block body %}{% endblock %}
  </main>

  <footer class="container page pb-4 text-muted small">
    <a class="link-secondary" href="{{ url_for('privacy') }}">Privacy Policy</a>
  </footer>
</body>
</html>
