[project]
name = "gcal-sync"
version = "0.1.0"
description = "Self-hosted bidirectional Google Calendar availability sync"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "flask>=3.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
web = [
    "gunicorn>=22.0.0",
]

[project.scripts]
gcal-sync = "gcal_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcal_sync"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
